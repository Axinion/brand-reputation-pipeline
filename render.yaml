services:
  - type: web
    name: brand-reputation-pipeline
    env: python
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: BRAND_NAME
        value: Netflix
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
